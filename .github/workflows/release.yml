name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publication target (PyPI requires an existing version tag)"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  test:
    name: Run quality and test gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and inspect distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
          python-version: "3.13"
      - name: Require matching metadata for version tags
        env:
          RELEASE_REF: ${{ github.ref }}
          PUBLICATION_TARGET: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"]
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"Tag {ref} does not match package version {version}")
          if os.environ["PUBLICATION_TARGET"] == "pypi" and ref != f"refs/tags/v{version}":
              raise SystemExit("PyPI publication requires the existing matching version tag")
          PY
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate distribution metadata
        run: uv tool run --from twine twine check --strict dist/*
      - name: Inspect wheel metadata and packaged resources
        run: |
          python - <<'PY'
          import configparser
          import email
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected one release wheel")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              resources = {
                  "taskweaver/py.typed",
                  "taskweaver/tui/styles.tcss",
                  "taskweaver/agents/prompts/orchestrator.md",
                  "taskweaver/agents/prompts/task.md",
                  "taskweaver/agents/prompts/research.md",
              }
              missing = resources.difference(names)
              if missing:
                  raise SystemExit(f"Missing wheel resources: {sorted(missing)}")
              if any("/tests/" in name or "/.agents/plans/" in name for name in names):
                  raise SystemExit("Wheel contains tests or saved agent plans")
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(wheel.read(metadata_path))
              if metadata["Name"] != "taskweaver" or metadata["Version"] != version:
                  raise SystemExit("Wheel metadata differs from pyproject.toml")
              requirements = metadata.get_all("Requires-Dist", [])
              if any(item.startswith("pydantic-ai ") or item.startswith("pydantic-ai>") for item in requirements):
                  raise SystemExit("Wheel must use pydantic-ai-slim, not the full SDK")
              for optional in ("mem0ai", "qdrant-client", "langfuse"):
                  matches = [item for item in requirements if item.startswith(optional)]
                  if not matches or any("extra ==" not in item for item in matches):
                      raise SystemExit(f"{optional} must be an optional dependency")
              entry_path = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
              entries = configparser.ConfigParser()
              entries.read_string(wheel.read(entry_path).decode())
              for name in ("taskweaver", "tw"):
                  if entries["console_scripts"].get(name) != "taskweaver.cli:main":
                      raise SystemExit(f"Missing or incorrect {name} entrypoint")
          for source in Path("dist").glob("*.tar.gz"):
              with tarfile.open(source) as archive:
                  if any("/tests/" in name or "/.agents/plans/" in name for name in archive.getnames()):
                      raise SystemExit("Source distribution contains tests or saved agent plans")
          PY
      - name: Install wheel with locked default dependencies outside checkout
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/taskweaver-requirements.txt"
          uv venv --python 3.13 "$RUNNER_TEMP/taskweaver-wheel"
          uv pip install --python "$RUNNER_TEMP/taskweaver-wheel/bin/python" --requirement "$RUNNER_TEMP/taskweaver-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/taskweaver-wheel/bin/python" --no-deps dist/*.whl
      - name: Exercise installed unkeyed product and resources
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/taskweaver-config
          XDG_DATA_HOME: ${{ runner.temp }}/taskweaver-data
          XDG_CACHE_HOME: ${{ runner.temp }}/taskweaver-cache
          XDG_STATE_HOME: ${{ runner.temp }}/taskweaver-state
        run: |
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/taskweaver-wheel/bin:$PATH"
          unset TASKWEAVER_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY GEMINI_API_KEY
          taskweaver --version
          tw --version
          taskweaver --help
          tw ls
          python - <<'PY'
          import sys
          from importlib.metadata import version
          from importlib.resources import files

          import taskweaver
          import taskweaver.cli

          if taskweaver.__version__ != version("taskweaver"):
              raise SystemExit("Runtime version differs from distribution metadata")
          resources = files("taskweaver")
          for path in (
              "py.typed",
              "tui/styles.tcss",
              "agents/prompts/orchestrator.md",
              "agents/prompts/task.md",
              "agents/prompts/research.md",
          ):
              if not resources.joinpath(path).is_file():
                  raise SystemExit(f"Installed resource unavailable: {path}")
          if any(name.split(".")[0] in {"mem0", "langfuse", "qdrant_client"} for name in sys.modules):
              raise SystemExit("Default CLI eagerly imports an optional backend")
          PY
      - name: Upload inspected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskweaver-distributions
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish manually approved TestPyPI artifact
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taskweaver-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish approved version-tagged PyPI artifact
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi') ||
       (github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taskweaver-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
