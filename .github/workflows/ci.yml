name: CI

on:
  push:
    branches: [main, master, develop, "product/**"]
  pull_request:
    branches: ["**"]
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run code quality checks
        run: make check

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: uv run python -m pytest

  container:
    name: Installed Container Smoke
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build installed nonroot product
        run: docker build --tag taskweaver:ci .
      - name: Exercise version and persistent local tasks
        run: |
          docker run --rm taskweaver:ci --version
          docker volume create "taskweaver-ci-${GITHUB_RUN_ID}"
          docker run --rm -v "taskweaver-ci-${GITHUB_RUN_ID}:/data" taskweaver:ci create "Persistence proof" --duration 20 --value 80 --req "Verify cross-container storage"
          docker run --rm -v "taskweaver-ci-${GITHUB_RUN_ID}:/data" --entrypoint python taskweaver:ci -c "from taskweaver.config import get_paths; from taskweaver.database.repository import TaskRepository; assert TaskRepository(get_paths().database_file).list_tasks()[0].title == 'Persistence proof'"
      - name: Remove disposable volume
        if: always()
        run: docker volume rm "taskweaver-ci-${GITHUB_RUN_ID}" || true
